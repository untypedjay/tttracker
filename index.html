<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TT Tracker</title>
        <style>
            .table-container {
                width: 100%;
                max-height: 400px;
                overflow-y: auto; /* Enable vertical scrolling */
                border: 1px solid #ccc; /* Optional: Add a border */
            }
            #games-table {
                width: 100%; /* Ensure the table takes the full width of the container */
                border-collapse: collapse; /* Optional: Remove cell spacing */
            }
            #games-table th, #games-table td {
                border: 1px solid #ddd; /* Optional: Add cell borders */
                padding: 8px; /* Optional: Add padding for better readability */
                text-align: left; /* Optional: Align text to the left */
            }
            #statistics-modal {
                display: none;
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background-color: white;
                border: 1px solid black;
                width: 80%; /* Increase the width */
                max-height: 80%; /* Increase the height */
                overflow-y: auto; /* Enable scrolling if content overflows */
                padding: 20px;
                z-index: 1000;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            }
            #overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                z-index: 999;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>TT Tracker</h1>
        </header>

        <form id="match-frm">
            <label for="player1">Player 1:</label>
            <input type="text" name="player1" id="player1"><br>
            <label for="player2">Player 2:</label>
            <input type="text" name="player2" id="player2"><br>
            <button id="statistics-btn" onclick="showStatistics(event)">Show Statistics</button>
            <label for="date-time">Date and Time:</label>
            <input type="datetime-local" name="dateTime" id="date-time"><br>
            <label for="player1-won">Player 1 Won:</label>
            <input type="text" name="player1-won" id="player1-won"><br>
            <label for="player2-won">Player 2 Won:</label>
            <input type="text" name="player2-won" id="player2-won"><br>

            <button id="add-game-btn" onclick="handleAddGameButton(event)">Add</button>
        </form>
        
        <div class="table-container">
            <table id="games-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Player 1</th>
                        <th>Player 2</th>
                        <th>Matches</th>
                    </tr>
                </thead>
                <tbody id="games-data"></tbody>
            </table>
        </div>

        <button id="download-btn" onclick="handleDownloadButton()">Create Backup</button>
        <button id="upload-btn" onclick="handleUploadButton()">Import Backup</button>

        <div id="statistics-modal">
            <h3 id="statistics-title"></h3>
            <div id="statistics-content"></div>
            <button onclick="closeStatistics()">Close</button>
        </div>

        <!-- Overlay to cover the background -->
        <div id="overlay"></div>

        <script>
            const formatDateTime = (date) => {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0'); // Months are zero-based
                const day = String(date.getDate()).padStart(2, '0');
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                return `${year}-${month}-${day}T${hours}:${minutes}`;
            };

            // Get the current date and time
            const now = new Date();

            // Format the current date and time
            const formattedDateTime = formatDateTime(now);

            // Set the default value of the datetime input
            document.getElementById('date-time').value = formattedDateTime;

            const updateLocalStorage = (games) => {
                const fingerprint = {
                    "timestamp": new Date().toISOString(),
                    "hash": hashString(JSON.stringify(games))
                };

                localStorage.setItem('games', JSON.stringify(games));
                localStorage.setItem('fingerprint', JSON.stringify(fingerprint));
            };

            const addTableRow = (game) => {
                let gamesDataTableBody = document.getElementById('games-data');
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${game.date}</td>
                    <td>${game.player1_name}</td>
                    <td>${game.player2_name}</td>
                    <td>${game.player1_matches_won}:${game.player2_matches_won}</td>
                    <button class="delete-game-btn" onclick="handleDeleteGameButton()">X</button>
                `;
                gamesDataTableBody.appendChild(row);
            };

            const games = JSON.parse(localStorage.getItem('games'));

            if (games) {
                for (const game of games) {
                    addTableRow(game);
                }
            }

            const showStatistics = event => {
                event.preventDefault();
                const player1 = document.getElementById('player1').value;
                const player2 = document.getElementById('player2').value;
                const games = findGames(player1, player2)
                const totalGames = games.length;
                const player1Wins = countWins(games, player1);
                const player2Wins = countWins(games, player2);
                const title = `Statistics for ${player1} and ${player2}`;
                const content = `
                    <p><strong>Total Games:</strong> ${totalGames}</p>
                    <p><strong>Games won (${player1} : ${player2}):</strong> ${player1Wins} : ${player2Wins}</p>
                    <p><strong>Win rate (${player1} : ${player2}):</strong> ${formatAsPercentage(player1Wins / totalGames)} : ${formatAsPercentage(player2Wins / totalGames)}</p>
                `;
    
                document.getElementById('statistics-title').innerText = title;
                document.getElementById('statistics-content').innerHTML = content;
                document.getElementById('statistics-modal').style.display = 'block';
                document.getElementById('overlay').style.display = 'block';
            };

            const formatAsPercentage = (decimal) => {
                return (decimal * 100).toFixed(2) + '%';
            };

            const findGames = (player1, player2) => {
                const games = JSON.parse(localStorage.getItem('games')) || [];
                return games.filter(game => {
                    return (game.player1_name === player1 && game.player2_name === player2) ||
                           (game.player1_name === player2 && game.player2_name === player1);
                });
            };

            const countWins = (games, playerName) => {
                return games.reduce((winCount, game) => {
                    if (game.player1_name === playerName && game.player1_matches_won > game.player2_matches_won) {
                        return winCount + 1;
                    } else if (game.player2_name === playerName && game.player2_matches_won > game.player1_matches_won) {
                        return winCount + 1;
                    }
                return winCount;
                }, 0);
            };

            const closeStatistics = () => {
                document.getElementById('statistics-modal').style.display = 'none';
                document.getElementById('overlay').style.display = 'none';
            };

            const handleAddGameButton = event => {
                event.preventDefault();
                const games = JSON.parse(localStorage.getItem('games')) || [];

                const player1Name = document.getElementById('player1').value;
                const player2Name = document.getElementById('player2').value;
                const dateTimeValue = document.getElementById('date-time').value;
                const player1MatchesWon = document.getElementById('player1-won').value;
                const player2MatchesWon = document.getElementById('player2-won').value;

                // Create the game data object
                const game = {
                    "date": dateTimeValue || "",
                    "player1_name": player1Name,
                    "player2_name": player2Name,
                    "player1_matches_won": player1MatchesWon,
                    "player2_matches_won": player2MatchesWon
                };

                games.push(game);
                addTableRow(game);
                updateLocalStorage(games);
            };

            const handleDeleteGameButton = () => {
                // Get the row that was clicked to delete
                const deletedRow = event.target.parentNode;

                // Remove the row from the table
                deletedRow.remove();

                // Update local storage by removing the game data
                const games = JSON.parse(localStorage.getItem('games'));
                for (const [index, game] of games.entries()) {
                    if (game.date === deletedRow.cells[0].textContent) {
                        games.splice(index, 1);
                        break;
                    }
                }

                // Update local storage with the updated list of games
                localStorage.setItem('games', JSON.stringify(games));

                updateLocalStorage(games);
            };

            const handleDownloadButton = () => {
                const games = JSON.parse(localStorage.getItem('games'));
                const fingerprint = JSON.parse(localStorage.getItem('fingerprint'));
                const data = JSON.stringify({ games, fingerprint });

                // Create a blob and URL for the download link
                const blob = new Blob([data], {type: 'application/json'});
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `backup-${fingerprint.timestamp}.json`;
                a.click();

                // Clean up after the download
                setTimeout(function() {
                    window.URL.revokeObjectURL(url);
                }, 1000);
            };

            const hashString = (string) => {
                return string.split("").reduce(function(a, b) {
                    a = ((a << 5) - a) + b.charCodeAt(0);
                    return a & a;
                }, 0);
            };

            const handleUploadButton = () => {
                // Get a reference to the input element for uploading files
                const uploadInput = document.createElement('input');
                uploadInput.type = 'file';
                uploadInput.accept = '.json';

                // Add event listener for when file is selected or uploaded
                uploadInput.addEventListener('change', async (event) => {
                    if (!uploadInput.files.length) return;

                    try {
                        const file = uploadInput.files[0];
                        const reader = new FileReader();
                        reader.onload = () => {
                            const backupData = JSON.parse(reader.result);
                            const storedGames = JSON.parse(localStorage.getItem('games'));
                            const storedFingerprint = localStorage.getItem('fingerprint');

                            // Check if the hash of the uploaded data matches the stored fingerprint
                            if (hashString(JSON.stringify(backupData.games)) === backupData.fingerprint.hash) {
                                const gamesDataTableBody = document.getElementById('games-data');
                                Array.from(gamesDataTableBody.querySelectorAll('tr')).forEach((row) => {
                                    row.remove();
                                });

                                for (const game of backupData.games) {
                                    console.log(game)
                                    addTableRow(game);
                                }
                                updateLocalStorage(backupData.games);
                            } else {
                                alert('Invalid or corrupted backup file.');
                            }

                            uploadInput.value = '';
                        };
                        reader.readAsText(file);
                    } catch (error) {
                        console.error(error);
                        alert('Error importing backup: ' + error.message);
                    }
                });

                // Show the input element for uploading files
                document.body.appendChild(uploadInput);

                // Remove the file input after 5 seconds to prevent multiple uploads
                setTimeout(() => {
                    uploadInput.remove();
                }, 5000);
            };
        </script>
    </body>
</html>
